# Configuración de Ruff para analisis_videos (Fase 3: Solo configuración)
target-version = "py310"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (bugs, undefined variables, unused imports)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # Line too long (respetar formato natural de docstrings y CSS)
    "W291",  # Trailing whitespace (en Markdown dos espacios significan salto de línea)
    "W293",  # Blank line contains whitespace
    "E722",  # Do not use bare 'except'
    "E402",  # Module level import not at top of file
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "D", "F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
